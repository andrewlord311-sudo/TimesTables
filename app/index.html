<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Pip's Times Tables</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HOME -->
<section id="screen-home" class="screen active">
  <h1>🐹 Pip's Times Tables</h1>
  <p class="subtitle">Tap a game to start!</p>

  <div class="farm-wrap">
    <h2 class="farm-title">Guinea Pig Farm</h2>
    <div class="farm-grid" id="farm-grid"></div>
  </div>

  <!-- For Andrew and Laura, not Clara: which facts still need work. Hidden
       behind a tap so it never competes with the game for her attention. -->
  <button class="grownups-btn" id="grownups-btn">For grown-ups</button>
  <div class="grownups-panel hidden" id="grownups-panel"></div>

  <div class="home-buttons">
    <button class="game-tile" data-game="feed">
      <span class="tile-emoji">🥕</span>
      <span>Feed<br>Pip</span>
    </button>
    <button class="game-tile" data-game="jigsaw">
      <span class="tile-emoji">🧩</span>
      <span>Guinea Pig<br>Jigsaw</span>
    </button>
    <button class="game-tile" data-game="run">
      <span class="tile-emoji">🏃</span>
      <span>Guinea Pig<br>Run</span>
    </button>
  </div>
</section>

<!-- FEED PIP -->
<section id="screen-feed" class="screen">
  <button class="back-btn" data-back>←</button>
  <div class="stage-row" id="feed-stages"></div>
  <div class="progress-dots" id="feed-dots"></div>

  <div class="pip-stage">
    <div class="pip" id="feed-pip"></div>
  </div>

  <div class="question" id="feed-question">3 × 4 = ?</div>
  <div class="answer-area">
    <div class="typed" id="feed-typed"></div>
    <div class="keypad" id="feed-keypad"></div>
    <button class="stuck-btn" id="feed-stuck">Stuck? Show me three answers</button>
    <div class="answer-choices hidden" id="feed-choices"></div>
  </div>
</section>

<!-- GUINEA PIG JIGSAW -->
<section id="screen-jigsaw" class="screen">
  <button class="back-btn" data-back>←</button>
  <div class="stage-row" id="jigsaw-stages"></div>

  <div class="jigsaw-stage" id="jigsaw-stage-box">
    <div class="jigsaw-pic" id="jigsaw-pic"></div>
    <div class="jigsaw-grid" id="jigsaw-grid"></div>
  </div>

  <div class="question" id="jigsaw-question">3 × 4 = ?</div>
  <div class="answer-area">
    <div class="typed" id="jigsaw-typed"></div>
    <div class="keypad" id="jigsaw-keypad"></div>
    <button class="stuck-btn" id="jigsaw-stuck">Stuck? Show me three answers</button>
    <div class="answer-choices hidden" id="jigsaw-choices"></div>
  </div>
</section>

<!-- GUINEA PIG RUN -->
<!-- Year 3 target only: the 2, 5 and 10 tables, multipliers 1-12. Ten
     questions, none repeated, mixed across all three. The run is timed, but
     the clock is never on screen - see finishRun() in app.js. -->
<section id="screen-run" class="screen">
  <button class="back-btn" data-back>←</button>
  <h2 class="run-title">🏃 Guinea Pig Run</h2>

  <div class="run-track" id="run-track">
    <div class="run-sky"></div>
    <div class="run-obstacles" id="run-obstacles"></div>
    <div class="run-finish">🏁</div>
    <div class="run-pig" id="run-pig"></div>
    <div class="run-ground"></div>
  </div>

  <div class="progress-dots" id="run-dots"></div>

  <div class="question" id="run-question">2 × 4 = ?</div>
  <div class="answer-area">
    <div class="typed" id="run-typed"></div>
    <div class="keypad" id="run-keypad"></div>
    <button class="stuck-btn" id="run-stuck">Stuck? Show me three answers</button>
    <div class="answer-choices hidden" id="run-choices"></div>
  </div>
</section>

<!-- COMPLETE -->
<section id="screen-complete" class="screen">
  <div class="complete-card">
    <div class="complete-emoji" id="complete-emoji">⭐️🎉⭐️</div>
    <h2 id="complete-title">You did it!</h2>
    <p id="complete-message"></p>
    <div class="new-pig-reveal hidden" id="new-pig-reveal">
      <p class="new-pig-label">New guinea pig unlocked!</p>
      <div class="new-pig-avatar" id="new-pig-avatar"></div>
      <p class="new-pig-name" id="new-pig-name"></p>
    </div>
    <div class="complete-buttons">
      <button class="big-btn" id="play-again-btn">Play Again</button>
      <button class="big-btn secondary" id="home-btn">Home</button>
    </div>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
